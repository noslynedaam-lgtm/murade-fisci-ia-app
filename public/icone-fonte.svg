<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset=".3" stop-color="#e9b94a"/>
      <stop offset=".55" stop-color="#b77f16"/><stop offset=".8" stop-color="#f3cf6a"/><stop offset="1" stop-color="#9a6a10"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b77f16"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset=".7" stop-color="#d9a533"/><stop offset="1" stop-color="#a67212"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6fb"/><stop offset=".5" stop-color="#5eb4ea"/><stop offset="1" stop-color="#2b82c4"/>
    </linearGradient>
    <linearGradient id="blueD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bd6f6"/><stop offset=".6" stop-color="#3f9bdc"/><stop offset="1" stop-color="#1f6fb2"/>
    </linearGradient>
    <radialGradient id="pearl" cx=".4" cy=".3" r=".95">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f6f3ec"/><stop offset="1" stop-color="#e4dfd3"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/><stop offset=".5" stop-color="#b8841c"/><stop offset="1" stop-color="#f0cb66"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#6b4a0a" flood-opacity=".35"/>
    </filter>
    <filter id="shp" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <clipPath id="plateClip"><rect x="10" y="10" width="1004" height="1004" rx="205"/></clipPath>
  </defs>

  <!-- placa perola -->
  <rect x="10" y="10" width="1004" height="1004" rx="205" fill="url(#pearl)"/>
  <rect x="20" y="20" width="984" height="984" rx="196" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <rect x="48" y="48" width="928" height="928" rx="170" fill="none" stroke="#e3c477" stroke-width="2.5" opacity=".7"/>
  <g clip-path="url(#plateClip)" fill="none" stroke="#d9b45a" stroke-width="2.5" opacity=".55">
    <circle cx="512" cy="512" r="470"/>
    <path d="M110 330 C 60 520 90 700 190 860"/>
    <path d="M914 330 C 964 520 934 700 834 860"/>
    <ellipse cx="512" cy="512" rx="430" ry="450" stroke-width="1.8"/>
  </g>

  <g filter="url(#sh)">
    <!-- aro -->
    <circle cx="512" cy="512" r="352" fill="none" stroke="url(#gold)" stroke-width="26"/>
    <circle cx="512" cy="512" r="339" fill="none" stroke="#fff3c4" stroke-width="3" opacity=".8"/>
  </g>

  <g transform="translate(512 512) scale(1.07) translate(-512 -512)">
  <!-- NEURONIO (esquerda) -->
  <g transform="translate(330 565) scale(.78)" filter="url(#sh)">
    <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round">
      <path d="M-20 -22 C -60 -70 -90 -80 -120 -150"/>
      <path d="M-30 0 C -80 -20 -120 -10 -170 -50"/>
      <path d="M-30 20 C -90 40 -130 60 -170 110"/>
      <path d="M-14 34 C -30 90 -40 130 -90 180"/>
      <path d="M12 -34 C 20 -80 10 -120 30 -170"/>
      <path d="M22 28 C 50 70 70 100 60 150"/>
    </g>
    <g fill="url(#blueD)" stroke="#d9a533" stroke-width="5">
      <circle cx="-120" cy="-150" r="15"/><circle cx="-170" cy="-50" r="15"/>
      <circle cx="-170" cy="110" r="15"/><circle cx="-90" cy="180" r="15"/>
      <circle cx="30" cy="-170" r="15"/><circle cx="60" cy="150" r="15"/>
    </g>
    <circle r="50" fill="url(#gold)"/>
    <circle r="36" fill="url(#blue)" stroke="#fff6d0" stroke-width="4"/>
    <circle r="14" fill="url(#gold)"/>
    <ellipse cx="-12" cy="-16" rx="14" ry="8" fill="#fff" opacity=".6"/>
  </g>

  <!-- BALANCA (centro) -->
  <g transform="translate(497 535) scale(.8)" filter="url(#sh)">
    <circle cy="-190" r="16" fill="url(#gold)"/>
    <rect x="-9" y="-176" width="18" height="300" rx="8" fill="url(#goldH)"/>
    <path d="M-80 122 H80 L100 150 H-100 Z" fill="url(#gold)"/>
    <path d="M-60 106 H60 L80 122 H-80 Z" fill="url(#goldH)"/>
    <path d="M-120 -148 Q0 -172 120 -148" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <g stroke="url(#gold)" stroke-width="5" fill="none">
      <path d="M-120 -146 L-168 -20 M-120 -146 L-72 -20"/>
      <path d="M120 -146 L72 -20 M120 -146 L168 -20"/>
    </g>
    <path d="M-182 -20 H-58 Q-62 40 -120 44 Q-178 40 -182 -20 Z" fill="url(#blue)" stroke="url(#gold)" stroke-width="7"/>
    <path d="M58 -20 H182 Q178 40 120 44 Q62 40 58 -20 Z" fill="url(#blue)" stroke="url(#gold)" stroke-width="7"/>
    <path d="M-170 -10 H-70" stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round"/>
    <path d="M70 -10 H170" stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round"/>
  </g>

  <!-- PENA (direita) -->
  <g transform="translate(695 505) scale(.74) rotate(26)" filter="url(#sh)">
    <path d="M0 -250 C 95 -170 120 -20 50 130 C 30 170 12 200 4 230 L -4 230 C -6 150 -30 60 -52 -10 C -75 -90 -55 -190 0 -250 Z" fill="url(#blue)" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
    <g stroke="#fff" stroke-width="4" opacity=".7" stroke-linecap="round" fill="none">
      <path d="M4 -140 L 50 -112"/><path d="M4 -90 L 70 -58"/><path d="M4 -40 L 72 -6"/><path d="M4 10 L 62 44"/><path d="M0 60 L 44 92"/>
      <path d="M-4 -120 L -40 -96"/><path d="M-4 -70 L -54 -40"/><path d="M-4 -20 L -54 12"/><path d="M-6 30 L -38 58"/>
    </g>
    <path d="M0 -236 L 0 250" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M-14 232 L14 232 L0 300 Z" fill="url(#goldH)" stroke="#b77f16" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-5 244 L5 244 L0 278 Z" fill="#7a5410"/>
  </g>

  </g>
  <!-- brilho -->
  <path d="M120 150 C 300 60 600 60 860 150" fill="none" stroke="#fff" stroke-width="8" opacity=".5" stroke-linecap="round"/>
</svg>
